# config-rhcos-renames.cfg — manual rename bridge between RHCOS baseline
# (RHEL 10 kernel 6.12.x — OCP 4.22 rhel-coreos-10; było RHEL 9 / 5.14.x do OCP 4.21)
# and our build kernel (6.18.x).
#
# 2026-06-16 (bump 4.22/RHEL10): re-audit verify-merge na bazie 6.12 → 148 rejected
# (126 renamed-candidates, 22 removed) to oczekiwana unifikacja crypto/CRC 6.12→6.18
# + szum sprzętowy. ŻADEN nie wymaga nowego renamu: Tier1-5 (K8s/OVN/CRIO/LUKS/Ceph)
# przechodzą, final config niesie funkcjonalność pod nazwami 6.18. Wpisy niżej (iptables
# legacy + build-fix disable'y RPi-tree) zostają — nadal aktywne i potrzebne.
#
# RHCOS config-rhcos.cfg may reference symbols that were renamed, split, or
# removed in 6.18. Each entry in this file should:
#   1. Replace a renamed symbol with its new 6.18 name.
#   2. Force-enable a symbol with a different default in 6.18 that we still need.
#
# Generated by audit of `merge-rhcos.log` ("not in final" warnings) and verified
# against Documentation/, Kconfig grep, and git log in linux-6.18 source tree.
# See verify-merge.sh --hw rpi5 output for rejected-symbols-report.md.
#
# Merge order:  defconfig -> config-rhcos.cfg -> config-rhcos-renames.cfg -> config-bcm27xx.cfg
#
# Format: standard kernel config syntax (CONFIG_X=m|y, # CONFIG_Y is not set).

# ---------------------------------------------------------------------------
# IP_NF_IPTABLES split (5.14 unified -> 6.x split legacy/modern)
# ---------------------------------------------------------------------------
# In 6.x, the legacy iptables backend was moved to a separate Kconfig.
# RHCOS (5.14) ships CONFIG_IP_NF_IPTABLES=m which historically covered both.
# In 6.18 CONFIG_IP_NF_NAT depends on CONFIG_IP_NF_IPTABLES_LEGACY, which is
# unset by default — force-enable so OVN-K / iptables NAT path works.
#
# Discovered by verify-merge.sh audit (Tier 2 OVN missing CONFIG_IP_NF_NAT).
CONFIG_NETFILTER_XTABLES_LEGACY=y
CONFIG_IP_NF_IPTABLES_LEGACY=m
CONFIG_IP6_NF_IPTABLES_LEGACY=m

# ---------------------------------------------------------------------------
# Disable UAPI header build-time sanity check
# ---------------------------------------------------------------------------
# RHCOS (RHEL 9 kernel) ships CONFIG_UAPI_HEADER_TEST=y. Raspberry Pi tree
# (raspberrypi/linux rpi-6.18.y) has at least one broken uapi header —
# include/uapi/misc/rp1_pio_if.h uses POSIX uint32_t/uint16_t/uint8_t
# instead of kernel's __u32/__u16/__u8 from <linux/types.h>. The HDRTEST
# stage of `make` fails with "unknown type name 'uint32_t'", aborting
# the build.
#
# Discovered by COPR build 10446855 (kernel-rpi4) failing on HDRTEST.
# Fix at the source would require patching the RPi tree; simpler to
# disable HDRTEST here (it's purely a build-time validation, not a
# kernel feature).
# CONFIG_UAPI_HEADER_TEST is not set

# SYSTEM_TRUSTED_KEYS: file is generated in kernel.spec %prep as an empty
# truncate -s0 certs/rhel.pem (mirroring Fedora kernel.spec). RHCOS config
# value "certs/rhel.pem" is preserved — no override needed here.

# ---------------------------------------------------------------------------
# Disable Blokas Pisound (audio HAT) — modpost dependency bug in RPi tree
# ---------------------------------------------------------------------------
# RPi bcm271X_defconfig enables CONFIG_SND_PISOUND=m + CONFIG_SND_PISOUND_MICRO=m.
# Their Kconfig stanzas depend only on SND_SEQUENCER, but the actual sources
# (sound/drivers/upisnd/snd-soc-upisnd-{codec,ctrl}.c) call SND_SOC framework
# symbols (snd_soc_register_card, snd_soc_dai_set_tdm_slot, ...).
#
# RHCOS baseline has CONFIG_SND_SOC unset (server kernel — no audio stack),
# overriding the RPi defconfig — so upisnd modules try to link against an
# absent framework. Result: 12+ "undefined symbol" modpost errors.
#
# We don't use Pisound HATs on the OCP cluster. Disable explicitly.
#
# Discovered by COPR build 10446875/10446876 failure.
# CONFIG_SND_PISOUND is not set
# CONFIG_SND_PISOUND_MICRO is not set

# ---------------------------------------------------------------------------
# Disable NFS-over-RDMA — depmod failure (cross-package symbol)
# ---------------------------------------------------------------------------
# rpcrdma.ko (net/sunrpc/xprtrdma) is filtered into kernel-modules-extra
# via singlemods in filter-modules.sh, but its dependency ib_core.ko
# (drivers/infiniband/ → driverdirs filter → modules-extra) lives in
# a different sub-tree of the build root. depmod -b can't resolve the
# cross-tree symbol rdma_rw_ctx_init, fails with:
#   "needs unknown symbol rdma_rw_ctx_init"
#
# RPi nodes don't have RDMA hardware (no InfiniBand NICs); disable the
# RDMA RPC transport. Standard NFS over TCP still works.
#
# Discovered by COPR build 10447068 (kernel-rpi5 retry #4).
# CONFIG_SUNRPC_XPRT_RDMA is not set
# CONFIG_CIFS_SMB_DIRECT is not set
# CONFIG_NVME_RDMA is not set
# CONFIG_INFINIBAND_SRP is not set
# CONFIG_INFINIBAND_SRPT is not set
# CONFIG_INFINIBAND_ISERT is not set
