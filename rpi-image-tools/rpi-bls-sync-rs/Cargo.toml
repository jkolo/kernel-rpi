[package]
name = "rpi-bls-sync-rs"
version = "0.1.0"
edition = "2024"

[lib]
name = "rpi_bls_sync"
path = "src/lib.rs"

[[bin]]
name = "rpi-bls-sync"
path = "src/main.rs"

[dependencies]
rustix = { version = "1.1.4", features = ["fs", "mount"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
