# Drop-in: run rpi-bls-sync after ostree finalize-staged updates BLS entries.
#
# Without this, on shutdown:
#   1. rpi-bls-sync-shutdown.service runs (reads OLD BLS, writes cmdline.txt)
#   2. ostree-finalize-staged.ExecStop runs ("bootconfig swap: yes") → BLS now points to NEW boot.X
#   3. Reboot → cmdline.txt references OLD ostree path → ostree-prepare-root fails → emergency mode
#
# ExecStopPost runs AFTER ExecStop completes, regardless of ExecStop exit status,
# so cmdline.txt always reflects the post-finalization BLS state.
#
# Pattern reference: openshift/machine-config-operator PR #2414 documents that
# ostree-finalize-staged uses ExecStop (not ExecStart) — confirmed by upstream
# github.com/ostreedev/ostree/blob/main/src/boot/ostree-finalize-staged.service
[Service]
ExecStopPost=/usr/sbin/rpi-bls-sync.sh
